# Blueprint Render — use "New > Blueprint" na raiz do repositório
# ou configure o Web Service com Root Directory: backend

services:
  - type: web
    name: mercadoloja
    runtime: docker
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: mercadofacil-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://mercado-loja.vercel.app,http://localhost:5173,http://localhost:5175
      - key: PUBLIC_API_URL
        sync: false

databases:
  - name: mercadofacil-db
    plan: free
    region: oregon
