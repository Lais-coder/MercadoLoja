services:
  - type: web
    name: mercadoloja
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mercadofacil-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://mercado-loja.vercel.app,http://localhost:5173,http://localhost:5175
      - key: PUBLIC_API_URL
        sync: false

databases:
  - name: mercadofacil-db
    plan: free
